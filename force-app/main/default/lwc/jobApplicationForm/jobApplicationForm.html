<template>
    <template lwc:if={isLoading}>
        <lightning-spinner alternative-text="Loading" size="large"></lightning-spinner>
    </template>
    <template lwc:else>
        <lightning-card title="Job Application Form" icon-name="standard:contact">
        <div class="form-container">
            <template lwc:if={showForm}>
                <lightning-input class="form-input" label="First Name" value={application.firstName} 
                    onchange={handleInputChange} name="firstName" required>
                </lightning-input>
                <lightning-input class="form-input" label="Last Name" value={application.lastName} 
                    onchange={handleInputChange} name="lastName" required></lightning-input>
                <lightning-input class="form-input" type="email" label="Email" value={application.email} 
                    onchange={handleInputChange} name="email" required>
                    </lightning-input>
                <lightning-input class="form-input" type="tel" label="Phone Number" value={application.phone} 
                    onchange={handleInputChange} name="phone" required>
                </lightning-input>
                <div class="submit-section"> 
                    <lightning-button label={buttonName} variant="brand" onclick={handleButtonAction}></lightning-button>
                </div>
            </template>
            <template lwc:else>
                <div class="upload-section">
                    <lightning-file-upload 
                        label="Upload Resume"
                        name="resumeUploader"
                        accept=".pdf"
                        record-id={application.applicationId}
                        file-field-name="Guest_Record_fileupload__c"
                        file-field-value={application.applicationId}
                        onuploadfinished={handleUploadFinished}
                        multiple=false
                        required>
                    </lightning-file-upload>
                </div>
                <div if:true={showSubmit} class="submit-section"> 
                    <lightning-button label={buttonName} variant="brand" onclick={handleButtonAction}></lightning-button>
                </div>
            </template>
        </div>
    </lightning-card>
    </template>
</template>
