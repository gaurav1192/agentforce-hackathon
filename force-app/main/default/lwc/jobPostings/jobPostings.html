<template>
    <lightning-card title="Open Job Postings">
    <div class="slds-p-around_medium">
        <template lwc:if={jobPostings}>
            <lightning-layout multiple-rows="true" horizontal-align="spread" class="job-grid">
                <template for:each={jobPostings} for:item="job">
                    <lightning-layout-item key={job.Id} size="12" small-device-size="6" medium-device-size="4" large-device-size="3" padding="around-small">
                        <div class="job-card" onclick={navigateToJobApplication} data-job-posting-id={job.Id}>
                            <div class="slds-card__header">
                                <h3 class="slds-card__header-title">
                                    <a href="#" class="job-card-title slds-truncate" title={job.Title__c}>
                                        {job.Title__c}
                                    </a>
                                </h3>
                            </div>
                            <div class="slds-card__body slds-card__body_inner">
                                <p class="job-card-text"><strong>Job ID:</strong> {job.Name}</p>
                                <p class="job-card-text"><strong>Location:</strong> {job.Location__c}</p>
                                <p class="job-card-text"><strong>Open Positions:</strong> {job.Open_Positions__c}</p>
                                <p class="job-card-text"><strong>Description:</strong></p>
                                <lightning-formatted-rich-text value={job.Job_Description__c}></lightning-formatted-rich-text>
                            </div>
                        </div>
                    </lightning-layout-item>
                </template>
            </lightning-layout>
        </template>
        <template lwc:else>
            <p>No job postings available.</p>
        </template>
    </div>
</lightning-card>

</template>
